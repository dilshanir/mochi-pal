<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets the game use the whole phone screen; CSS adds safe-area padding back. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Mochi Pal</title>
  <meta name="description" content="Raise Mochi, a squishy little rice-cake pet. Feed it, bathe it, tuck it in, play games, and watch its sprout bloom. Free, in your browser.">
  <meta name="theme-color" content="#2E1F47">

  <!-- Share previews (WhatsApp, Facebook, X). Scrapers need absolute URLs here. -->
  <link rel="canonical" href="https://dilshanir.github.io/mochi-pal/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://dilshanir.github.io/mochi-pal/">
  <meta property="og:title" content="Mochi Pal: raise your own squishy pet">
  <meta property="og:description" content="Feed it, bathe it, play with it, and watch its sprout bloom. It talks back, too.">
  <meta property="og:image" content="https://dilshanir.github.io/mochi-pal/icons/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Installable app (PWA): add to home screen, works offline. -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Preload the display font so the HUD numbers don't flash in a fallback font. -->
  <link rel="preload" href="fonts/mochiy-pop-one-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- data-tod (time of day) is set by main.js from the player's clock: morning | day | evening | night -->
  <div id="app" class="app" data-tod="day">
    <div class="stage" id="stage">

      <!-- ===== Top HUD: level + XP, coins, streak, settings ===== -->
      <header class="hud">
        <button class="lvl" id="lvlBtn" type="button" aria-label="Level and growth">
          <span class="lvl-num" id="lvlNum">1</span>
          <span class="lvl-info">
            <span class="lvl-name" id="petNameLbl">Mochi</span>
            <span class="lvl-stage" id="stageLbl">Sprout</span>
            <span class="xpbar" aria-hidden="true"><i id="xpFill"></i></span>
          </span>
        </button>
        <div class="hud-right">
          <button class="pill pill-coins" id="coinsBtn" type="button" aria-label="Coins">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#FFC23D" stroke="currentColor" stroke-width="2.5"/><circle cx="12" cy="12" r="4.5" fill="none" stroke="#E0A11F" stroke-width="2"/></svg>
            <b id="coins">0</b>
          </button>
          <button class="pill pill-streak" id="streakBtn" type="button" aria-label="Daily streak">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c1 4 5 5.5 5 11a5 5 0 0 1-10 0c0-2.5 1.2-4 2.5-5 .2 1.8.9 2.8 2 3.2C11 9 10.5 6 12 2.5Z" fill="#FF7A3D" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>
            <b id="streak">0</b>
          </button>
          <button class="icon-btn" id="settingsBtn" type="button" aria-label="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm8 3.5-2 .6-.5 1.3 1 1.8-1.7 1.7-1.8-1-1.3.5-.6 2h-2.4l-.6-2-1.3-.5-1.8 1-1.7-1.7 1-1.8-.5-1.3-2-.6v-2.4l2-.6.5-1.3-1-1.8 1.7-1.7 1.8 1 1.3-.5.6-2h2.4l.6 2 1.3.5 1.8-1 1.7 1.7-1 1.8.5 1.3 2 .6Z" fill="#fff" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </header>

      <!-- ===== Needs: four dials, filled by main.js from game state ===== -->
      <div class="needs" id="needs" role="group" aria-label="Mochi's needs">
        <div class="need" data-need="hunger"><span class="dial"><span class="ico">🍙</span></span><span class="need-lbl">Food</span></div>
        <div class="need" data-need="energy"><span class="dial"><span class="ico">⚡</span></span><span class="need-lbl">Energy</span></div>
        <div class="need" data-need="fun"><span class="dial"><span class="ico">🎈</span></span><span class="need-lbl">Fun</span></div>
        <div class="need" data-need="clean"><span class="dial"><span class="ico">🧼</span></span><span class="need-lbl">Clean</span></div>
      </div>

      <!-- ===== The room: window sky follows real local time ===== -->
      <main class="room" id="room">
        <div class="wall" aria-hidden="true">
          <div class="window">
            <div class="sky">
              <span class="sun"></span>
              <span class="cloud c1"></span><span class="cloud c2"></span>
              <span class="stars"></span>
            </div>
            <span class="frame-v"></span><span class="frame-h"></span>
          </div>
          <div class="shelf"><span class="plant"></span><span class="jar"></span></div>
        </div>
        <div class="floor" aria-hidden="true"><span class="rug"></span></div>

        <div class="side side-left">
          <button class="side-btn" id="giftBtn" type="button" aria-label="Gift box">
            <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="6" y="16" width="28" height="18" rx="3" fill="#FF5D8F" stroke="currentColor" stroke-width="3"/><rect x="4" y="11" width="32" height="7" rx="2.5" fill="#FF8FC3" stroke="currentColor" stroke-width="3"/><path d="M20 11v23" stroke="#FFC23D" stroke-width="4"/><path d="M20 11c-3-6-10-6-9-1 1 3 6 1 9 1Zm0 0c3-6 10-6 9-1-1 3-6 1-9 1Z" fill="#FFC23D" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></svg>
            <span class="side-sub" id="giftTimer"></span>
          </button>
          <button class="side-btn" id="dailyBtn" type="button" aria-label="Daily rewards">
            <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="6" y="9" width="28" height="25" rx="5" fill="#fff" stroke="currentColor" stroke-width="3"/><path d="M6 17h28" stroke="currentColor" stroke-width="3"/><rect x="6" y="9" width="28" height="8" rx="4" fill="#2FB7B0" stroke="currentColor" stroke-width="3"/><path d="M13 6v6M27 6v6" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M15 25l3.5 3.5L26 21" fill="none" stroke="#FF5D8F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="badge" id="dailyBadge" hidden>!</span>
          </button>
        </div>
        <div class="side side-right">
          <button class="side-btn" id="questBtn" type="button" aria-label="Daily quests">
            <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M10 6h18a4 4 0 0 1 4 4v24H12a4 4 0 0 1-4-4V8a2 2 0 0 1 2-2Z" fill="#FFF3CB" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M14 15h12M14 21h12M14 27h7" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
            <span class="badge" id="questBadge" hidden>0</span>
          </button>
          <button class="side-btn mic-btn" id="talkBtn" type="button" aria-label="Talk to Mochi" aria-pressed="false">
            <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="14" y="5" width="12" height="20" rx="6" fill="#9C7BFF" stroke="currentColor" stroke-width="3"/><path d="M9 19a11 11 0 0 0 22 0M20 30v5M14 35h12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
          </button>
        </div>

        <div class="bubble" id="bubble" role="status" aria-live="polite"></div>
        <!-- Mochi lives here. pet.js draws the SVG inside this element. -->
        <div class="pet-wrap" id="petWrap" tabindex="0" role="button"
             aria-label="Mochi. Tap the head to boop, stroke to pet, tap the tummy to tickle."></div>
        <div class="darkness" id="darkness" aria-hidden="true"></div>
        <!-- Contextual buttons for bath / sleep modes -->
        <div class="mode-bar" id="modeBar" hidden></div>
      </main>

      <!-- ===== Main actions ===== -->
      <nav class="actions" aria-label="Care for Mochi">
        <button class="act act-feed" data-act="feed" type="button">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M6 24h36a18 14 0 0 1-36 0Z" fill="#fff" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round"/><path d="M15 24c0-5 4-9 9-9s9 4 9 9" fill="#FFF7EE" stroke="currentColor" stroke-width="3.2"/><path d="M19 24c1-3 3-4 5-4" fill="none" stroke="#FFC23D" stroke-width="3" stroke-linecap="round"/><path d="M33 8l-6 10M38 11l-8 9" stroke="#C98B4A" stroke-width="3" stroke-linecap="round"/></svg>
          <span>Feed</span>
        </button>
        <button class="act act-bath" data-act="bath" type="button">
          <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="8" y="20" width="26" height="18" rx="7" fill="#FFC23D" stroke="currentColor" stroke-width="3.2"/><path d="M12 27h18" stroke="#E0A11F" stroke-width="3" stroke-linecap="round"/><circle cx="35" cy="14" r="6" fill="#fff" stroke="currentColor" stroke-width="3"/><circle cx="24" cy="11" r="4" fill="#fff" stroke="currentColor" stroke-width="3"/><circle cx="40" cy="27" r="3.5" fill="#fff" stroke="currentColor" stroke-width="2.6"/></svg>
          <span>Bath</span>
        </button>
        <button class="act act-sleep" data-act="sleep" type="button">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M30 7a17 17 0 1 0 11 27A14 14 0 0 1 30 7Z" fill="#FFE27A" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round"/><path d="M33 16h6l-6 7h6" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span id="sleepLbl">Sleep</span>
        </button>
        <button class="act act-play" data-act="play" type="button">
          <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="16" fill="#2FB7B0" stroke="currentColor" stroke-width="3.2"/><path d="M9 20c8 3 22 3 30 0M12 32c8-3 16-3 24 0M24 8c-6 10-6 22 0 32" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>
          <span>Play</span>
        </button>
        <button class="act act-style" data-act="style" type="button">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 22 24 10l16 12-5 4-3-2v16H16V24l-3 2Z" fill="#FF8FC3" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round"/><path d="M19 13a5 5 0 0 0 10 0" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="24" cy="31" r="3" fill="#FFC23D" stroke="currentColor" stroke-width="2.4"/></svg>
          <span>Style</span>
        </button>
      </nav>

      <!-- Particles + floating text sit above everything in the stage -->
      <canvas class="fx" id="fx" aria-hidden="true"></canvas>
      <div class="text-layer" id="textLayer" aria-hidden="true"></div>
    </div>

    <!-- ===== Bottom sheet (Feed, Play, Style, Quests, Daily, Settings) — filled by ui.js ===== -->
    <div class="scrim" id="scrim" hidden></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
      <div class="sheet-head">
        <h2 id="sheetTitle"></h2>
        <button class="icon-btn sheet-close" id="sheetClose" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
    </section>

    <!-- ===== Centre card (welcome back, level up, gift reveal, hatching) ===== -->
    <div class="overlay" id="overlay" hidden>
      <div class="card" id="card" role="dialog" aria-modal="true"></div>
    </div>

    <!-- ===== Mini-game screen ===== -->
    <section class="game" id="game" hidden aria-label="Mini-game">
      <canvas id="gameCanvas"></canvas>
      <div class="game-hud">
        <span class="game-score" id="gameScore">0</span>
        <span class="game-lives" id="gameLives"></span>
        <button class="icon-btn" id="gameQuit" type="button" aria-label="Quit game">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="game-msg" id="gameMsg"></div>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <noscript><p class="noscript">Mochi needs JavaScript turned on to wake up.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
